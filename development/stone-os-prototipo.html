<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>STONE OS Prototipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Jost:wght@200;300&family=IBM+Plex+Mono&display=swap">
<style>
/* Layout: a fixed 1920×1080 console stage, scaled to fit the window, with a slim legend bar beneath. Single dark look by design. */
:root{
  --void:#0a0a0b; --basalt:#141517; --graphite:#1c1d1f; --shale:#2b2c2f; --slate:#5e6064;
  --ash:#8e9095; --warm:#ede9e3; --light:#ffffff; --ember:#c88a3a; --error:#d0675c;
  --text-2:var(--ash); --horizon:var(--shale); --line-w:2px; --scrim:.55;
  --f-display:Jost,Futura,"Century Gothic",sans-serif;
  --f-text:Inter,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono","JetBrains Mono",monospace;
  --d-step:220ms; --d-settle:360ms; --d-exit:450ms; --d-enter:600ms; --d-light:900ms; --d-cer:1200ms;
  --e-step:cubic-bezier(.25,.1,0,1); --e-settle:cubic-bezier(.2,0,0,1); --e-light:cubic-bezier(.4,0,.2,1);
  --e-exit:cubic-bezier(.4,0,1,1); --e-cer:cubic-bezier(.45,0,.15,1);
  --fscale:1.06; --ts:1;
  color-scheme:dark;
}
html,body{height:100%;background:var(--void);color:var(--warm)}
body{font-family:var(--f-text);overflow:hidden}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#viewport{flex:1;min-height:0;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--void);
  font-family:var(--f-text);user-select:none;-webkit-user-select:none;outline:none}
#bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;font-size:12px;color:var(--ash);min-width:0}
#bar .keys{display:flex;flex-wrap:wrap;gap:6px 16px;min-width:0}
#bar kbd{font-family:var(--f-mono);font-size:11px;color:var(--warm);border:1px solid var(--shale);border-radius:3px;padding:1px 5px;margin-right:4px}
#bar .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
#bar button,#bar select{font:500 12px var(--f-text);color:var(--warm);background:var(--graphite);border:1px solid var(--shale);border-radius:4px;padding:6px 12px;cursor:pointer;max-width:100%}
#bar button:hover,#bar select:hover{border-color:var(--ash)}
#bar button:focus-visible,#bar select:focus-visible{outline:2px solid var(--light);outline-offset:2px}
#bar .note{color:var(--slate)}

/* Theme modifiers inside the stage */
#stage.hc{--text-2:var(--warm);--horizon:var(--ash);--line-w:4px;--scrim:.78}

/* Backgrounds */
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity var(--d-light) var(--e-light)}
.bg.on{opacity:1}
#veil{position:absolute;inset:0;pointer-events:none;transition:opacity var(--d-light) var(--e-light);
  background:linear-gradient(to bottom,rgba(10,10,11,calc(var(--scrim) - .2)) 0%,rgba(10,10,11,var(--scrim)) 48%,rgba(10,10,11,.97) 64%,var(--void) 72%)}
#veil.side{background:linear-gradient(to right,rgba(10,10,11,.92) 0%,rgba(10,10,11,.78) 42%,rgba(10,10,11,.15) 72%,rgba(10,10,11,0) 100%),linear-gradient(to top,rgba(10,10,11,.9) 0%,rgba(10,10,11,0) 30%)}
#veil.none{opacity:0}

/* Shared chrome */
.brand{font-family:var(--f-display);font-weight:200;letter-spacing:.45em;color:var(--warm)}
#hdr{position:absolute;left:96px;right:96px;top:54px;height:48px;display:flex;justify-content:space-between;align-items:center;transition:opacity var(--d-enter) var(--e-light)}
#hdr .brand{font-size:32px}
#status{display:flex;gap:28px;align-items:center;font-size:20px;color:var(--text-2);font-variant-numeric:tabular-nums}
#status svg{stroke:var(--text-2)}
#status .pad.on svg{stroke:var(--warm)}
#safeBadge{font-size:15px;letter-spacing:.18em;color:var(--warm);border:1px solid var(--warm);border-radius:3px;padding:2px 8px}
#tabs{position:absolute;left:96px;top:140px;display:flex;gap:56px;font-family:var(--f-display);font-weight:300;font-size:22px;letter-spacing:.22em;transition:opacity var(--d-enter) var(--e-light)}
#tabs span{color:var(--text-2);transition:color var(--d-step) var(--e-step)}
#tabs span.cur{color:var(--warm)}
.hide{opacity:0!important;pointer-events:none}

.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity var(--d-enter) var(--e-light),visibility 0s linear var(--d-enter),transform var(--d-enter) var(--e-settle)}
.screen.on{opacity:1;visibility:visible;transition:opacity var(--d-enter) var(--e-light),visibility 0s,transform var(--d-enter) var(--e-settle)}
.screen.zoom{transform:scale(.985)}
.screen.on.zoom{transform:none}

/* Focus line: one per stage */
#line{position:absolute;left:0;top:0;width:1920px;height:var(--line-w);background:var(--light);border-radius:2px;z-index:61;pointer-events:none;
  transform-origin:0 50%;transform:translate(960px,886px) scaleX(0);
  transition:transform var(--d-step) var(--e-step),opacity var(--d-step) linear,translate 160ms var(--e-settle)}
#line.slow{transition:transform var(--d-cer) var(--e-cer),opacity var(--d-enter) linear,translate 160ms var(--e-settle)}
#line.off{opacity:0}
#line.load::after{content:"";position:absolute;top:0;left:0;height:100%;width:30%;background:var(--void);opacity:.55;animation:load 1.6s var(--e-light) infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(340%)}}

/* Focusables */
[data-f]{cursor:pointer}
.txt-f{color:var(--text-2);transition:color var(--d-step) var(--e-step)}
.txt-f.f{color:var(--warm)}

/* HOME */
#home .clip{position:absolute;left:0;top:0;width:1920px;height:680px;overflow:hidden}
#home .track{position:absolute;left:96px;top:0;height:680px;display:flex;gap:24px;align-items:flex-end;padding-bottom:26px;box-sizing:border-box;transition:transform var(--d-step) var(--e-step)}
.card{flex:none;border-radius:4px;background-color:var(--shale);background-size:cover;background-position:center;transform-origin:0 100%;transition:transform var(--d-settle) var(--e-settle),translate var(--d-settle) var(--e-settle);position:relative}
.card.f{transform:scale(var(--fscale))}
.card.hero{width:678px;height:382px}
.card.cap{width:200px;height:300px}
.card.tile{width:200px;height:300px;background:var(--graphite);display:flex;align-items:flex-end;padding:20px;box-sizing:border-box;font-family:var(--f-display);font-weight:300;letter-spacing:.2em;font-size:16px;color:var(--text-2)}
.card.wide{width:400px;height:225px;background:var(--graphite);display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:24px;box-sizing:border-box}
.card.wide b{font-family:var(--f-display);font-weight:300;letter-spacing:.2em;font-size:20px;color:var(--warm)}
.card.wide span{font-size:18px;color:var(--text-2)}
.card.dim{opacity:.4}
.card .run{position:absolute;left:24px;top:24px;font-family:var(--f-display);font-weight:300;letter-spacing:.3em;font-size:16px;color:var(--ember)}
#home .horizon{position:absolute;left:96px;top:669px;width:1728px;height:1px;background:var(--horizon)}
#home .ctx{position:absolute;left:96px;top:706px;display:flex;flex-direction:column;gap:8px;max-width:1300px}
.kicker{font-family:var(--f-display);font-weight:300;font-size:20px;letter-spacing:.3em;color:var(--text-2)}
.kicker .now{color:var(--ember)}
.ctx-title{font-family:var(--f-display);font-weight:300;font-size:calc(40px * var(--ts));line-height:1.2;letter-spacing:.3em;color:var(--warm);text-transform:uppercase}
.meta{font-size:calc(20px * var(--ts));color:var(--text-2);opacity:0;transition:opacity var(--d-light) var(--e-light);font-variant-numeric:tabular-nums}
.meta.on{opacity:1}
#home .sys{position:absolute;left:96px;top:930px;display:flex;gap:64px;font-size:22px}
#home .sys span{display:flex;gap:12px;align-items:center}
#home .sys svg{stroke:currentColor}

/* LIBRARY */
#library .filters{position:absolute;left:96px;top:206px;display:flex;gap:40px;font-size:22px}
#library .filters span.cur{color:var(--warm)}
#library .filters span.cur::after{content:"";display:block;height:2px;background:var(--slate);margin-top:8px}
#library .count{position:absolute;right:96px;top:210px;font-size:20px;color:var(--text-2)}
#library .gclip{position:absolute;left:0;top:276px;width:1920px;height:680px;overflow:hidden}
#library .grid{position:absolute;left:96px;top:4px;width:1728px;transition:transform var(--d-step) var(--e-step)}
#library .grid .card{position:absolute;width:254.67px;height:381px}
#library .empty{position:absolute;left:96px;top:300px;font-size:24px;color:var(--text-2)}
#library .sel{position:absolute;left:96px;top:994px;font-size:20px;color:var(--text-2);max-width:1100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* DETAIL */
/* Anchored above JUGAR and growing upwards, so a long name never runs into it (board, RC5). */
#detail .col{position:absolute;left:96px;bottom:540px;width:1000px;display:flex;flex-direction:column;gap:16px}
#detail .origin{font-size:20px;color:var(--text-2);letter-spacing:.1em}
#detail h1{margin:0;font-family:var(--f-display);font-weight:300;font-size:64px;line-height:72px;letter-spacing:.3em;color:var(--warm);text-wrap:balance;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
#detail h1.long{font-size:48px;line-height:56px;letter-spacing:.22em}
#detail .stats{font-size:calc(24px * var(--ts));line-height:1.4;color:var(--text-2);font-variant-numeric:tabular-nums}
#detail .primary{position:absolute;left:96px;top:560px;font-family:var(--f-display);font-weight:300;font-size:40px;line-height:48px;letter-spacing:.3em;color:var(--warm)}
#detail .second{position:absolute;left:96px;top:690px;display:flex;gap:64px;font-size:22px}
#detail .info{position:absolute;left:96px;right:96px;top:860px;border-top:1px solid var(--horizon);padding-top:24px;display:flex;gap:72px;font-size:20px;color:var(--text-2)}
#detail .info div{display:flex;flex-direction:column;gap:4px}
#detail .info b{font-weight:400;color:var(--warm)}

/* GAME */
#game .art{position:absolute;inset:-2%;background-size:cover;background-position:center;animation:drift 24s ease-in-out infinite alternate}
#game:not(.on) .art{animation:none}
@keyframes drift{from{transform:scale(1.02) translateX(0)}to{transform:scale(1.06) translateX(-1.5%)}}
#game .tag{position:absolute;left:96px;bottom:64px;font-size:20px;color:var(--warm);opacity:.85;transition:opacity 1.2s var(--e-light);text-shadow:0 1px 8px rgba(0,0,0,.6)}
#game .tag.gone{opacity:0}
#metrics{position:absolute;left:40px;top:32px;font-family:var(--f-mono);font-size:20px;line-height:30px;color:var(--warm);background:rgba(10,10,11,.72);padding:12px 18px;border-radius:4px;z-index:30;font-variant-numeric:tabular-nums;white-space:pre}

/* QUICK MENU */
#quick{position:absolute;inset:0;z-index:20;visibility:hidden;transition:visibility 0s linear var(--d-enter)}
#quick.on{visibility:visible;transition:visibility 0s}
#quick .dim{position:absolute;inset:0;background:var(--void);opacity:0;transition:opacity var(--d-enter) var(--e-light)}
#quick.on .dim{opacity:.45}
#quick .panel{position:absolute;right:0;top:0;width:560px;height:1080px;background:var(--basalt);box-sizing:border-box;padding:54px 56px;display:flex;flex-direction:column;gap:30px;transform:translateX(100%);transition:transform var(--d-enter) var(--e-settle)}
#quick.on .panel{transform:none}
#quick .top{display:flex;justify-content:space-between;align-items:center}
#quick .top .brand{font-size:24px}
#quick .top span:last-child{font-size:20px;color:var(--text-2)}
#quick .main{font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.18em}
#quick .it{font-size:24px}
#quick .seg{display:flex;flex-direction:column;gap:14px}
#quick .seg .lbl{font-size:20px}
#quick .opts{display:flex;gap:8px}
#quick .opts span{flex:1;text-align:center;padding:12px 0;border:1px solid var(--shale);border-radius:4px;font-size:20px;color:var(--text-2)}
#quick .opts span.cur{border-color:var(--ash);color:var(--warm)}
#quick .rule{height:1px;background:var(--shale)}
#quick .steam{display:flex;flex-direction:column;gap:18px}
#quick .steam .cap{font-size:16px;letter-spacing:.12em;color:var(--slate)}
#quick .steam .it{font-size:22px}
#quick .tog{color:var(--slate)}

/* SETTINGS */
#settings{background:var(--basalt)}
#settings .ttl{position:absolute;left:96px;top:140px;font-family:var(--f-display);font-weight:300;font-size:40px;letter-spacing:.3em}
#settings .cats{position:absolute;left:96px;top:236px;width:480px;display:flex;flex-direction:column;gap:20px;font-size:24px}
#settings .cats span.cur{color:var(--warm)}
#settings .vr{position:absolute;left:640px;top:236px;width:1px;height:700px;background:var(--shale)}
#settings .pane{position:absolute;left:704px;top:236px;width:1120px;display:flex;flex-direction:column;gap:28px}
#settings .desc{font-size:24px;line-height:34px;color:var(--text-2)}
#settings .rows{display:flex;flex-direction:column}
.srow{display:flex;justify-content:space-between;align-items:center;gap:32px;padding:22px 0;border-bottom:1px solid var(--shale)}
.srow:last-child{border-bottom:none}
.srow .l{display:flex;flex-direction:column;gap:6px}
.srow .l b{font-weight:400;font-size:calc(24px * var(--ts));color:var(--text-2);transition:color var(--d-step) var(--e-step)}
.srow.f .l b{color:var(--warm)}
.srow .l small{font-size:calc(20px * var(--ts));color:var(--text-2)}
.srow .v{font-size:20px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.srow.f .v{color:var(--warm)}
.srow .v .ar{color:var(--slate);padding:0 10px}
#safe{position:absolute;inset:0;pointer-events:none;z-index:35;opacity:0;transition:opacity var(--d-step) linear}
#safe.on{opacity:1}
#safe i{position:absolute;width:48px;height:48px;border-color:var(--ember);border-style:solid;border-width:0}

/* POWER */
#power{position:absolute;inset:0;z-index:25;visibility:hidden;transition:visibility 0s linear var(--d-enter)}
#power.on{visibility:visible;transition:visibility 0s}
#power .dim{position:absolute;inset:0;background:var(--void);opacity:0;transition:opacity var(--d-enter) var(--e-light)}
#power.on .dim{opacity:.72}
#power .box{position:absolute;left:660px;top:290px;width:600px;background:var(--basalt);border-radius:4px;box-sizing:border-box;padding:56px 64px;display:flex;flex-direction:column;gap:30px;opacity:0;transform:translateY(16px);transition:opacity var(--d-enter) var(--e-light),transform var(--d-enter) var(--e-settle)}
#power.on .box{opacity:1;transform:none}
#power .h{font-family:var(--f-display);font-weight:300;font-size:24px;letter-spacing:.3em;color:var(--text-2)}
#power .main{font-family:var(--f-display);font-weight:300;font-size:36px;letter-spacing:.3em}
#power .warn{font-size:20px;line-height:28px;color:var(--ember)}

/* PERFORMANCE CENTER */
#perf,#tuning{background:var(--basalt)}
.pttl{position:absolute;left:96px;top:140px;font-family:var(--f-display);font-weight:300;font-size:40px;letter-spacing:.3em}
.pstatus{position:absolute;left:96px;top:208px;font-size:20px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pstatus b{font-weight:400;color:var(--warm)}
.pread{position:absolute;left:96px;top:242px;font-size:17px;color:var(--text-3, var(--text-2));font-variant-numeric:tabular-nums;opacity:.8}
#perf .prow{position:absolute;left:96px;top:290px;display:flex;gap:24px}
.card.ptile{width:414px;height:270px;box-sizing:border-box;padding:28px;background:var(--graphite);display:flex;flex-direction:column;gap:10px}
.ptile .pn{font-family:var(--f-display);font-weight:300;font-size:28px;letter-spacing:.22em;color:var(--warm)}
.ptile .pd{font-size:20px;line-height:28px;color:var(--text-2)}
.ptile .ps{margin-top:auto;font-size:18px;line-height:26px;color:var(--text-2);font-variant-numeric:tabular-nums}
.ptile .pa{font-family:var(--f-display);font-weight:300;font-size:16px;letter-spacing:.3em;color:var(--ember);min-height:20px}
#perf .acts{position:absolute;left:96px;top:676px;display:flex;gap:64px;font-size:24px}
#perf .note{position:absolute;left:96px;top:770px;max-width:1150px;font-size:20px;line-height:30px;color:var(--text-2)}
#tuning .tclip{position:absolute;left:96px;top:250px;width:1000px;height:710px;overflow:hidden}
#tuning .trows{position:absolute;left:0;top:0;width:1000px;display:flex;flex-direction:column;transition:transform var(--d-step) var(--e-step)}
#tuning .side{position:absolute;left:1180px;top:262px;width:644px;display:flex;flex-direction:column;gap:20px}
.pbox{background:var(--graphite);border-radius:4px;padding:26px 32px;display:flex;flex-direction:column;gap:12px}
.pbox h3{margin:0 0 4px;font-family:var(--f-display);font-weight:300;font-size:18px;letter-spacing:.3em;color:var(--text-2)}
.kv{display:flex;justify-content:space-between;gap:24px;font-size:20px;color:var(--text-2);font-variant-numeric:tabular-nums}
.kv b{font-weight:400;color:var(--warm)}
.kv b.chg{color:var(--ember)}
.srow .v.ro{color:var(--slate)}
#dlg{position:absolute;inset:0;z-index:27;visibility:hidden}
#dlg.on{visibility:visible}
#dlg .dim{position:absolute;inset:0;background:var(--void);opacity:.85}
#dlg.solid .dim{opacity:1}
#dlg .box{position:absolute;left:520px;top:200px;width:880px;box-sizing:border-box;background:var(--basalt);border-radius:4px;padding:56px 64px;display:flex;flex-direction:column;gap:26px}
#dlg.solid .box{background:transparent;top:300px}
#dlg h2{margin:0;font-family:var(--f-display);font-weight:300;font-size:32px;letter-spacing:.3em;color:var(--warm)}
#dlg p{margin:0;font-size:22px;line-height:32px;color:var(--text-2)}
#dlg .btns{display:flex;gap:64px;font-family:var(--f-display);font-weight:300;font-size:26px;letter-spacing:.22em;margin-top:8px}
#dlg .live{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
#dlg .live div{display:flex;flex-direction:column;gap:6px;font-size:18px;color:var(--text-2)}
#dlg .live b{font-family:var(--f-mono);font-weight:400;font-size:28px;color:var(--warm);font-variant-numeric:tabular-nums}
#dlg .ptrack{height:2px;background:var(--shale);margin-top:8px}
#dlg .res{font-family:var(--f-display);font-weight:300;font-size:36px;letter-spacing:.3em;color:var(--warm)}
#dlg .kvs{display:flex;flex-direction:column;gap:10px}

/* BOOT / OFF */
#black{position:absolute;inset:0;background:#000;z-index:50;opacity:0;pointer-events:none;transition:opacity var(--d-enter) var(--e-light)}
#black.on{opacity:1}
#black.fast{transition-duration:var(--d-exit)}
#bootword{position:absolute;left:0;right:0;top:430px;text-align:center;font-size:64px;padding-left:.45em;z-index:60;opacity:0;transition:opacity var(--d-enter) var(--e-light)}
#bootword.on{opacity:1}
#offmsg{position:absolute;left:0;right:0;top:960px;text-align:center;font-size:20px;color:var(--slate);z-index:60;opacity:0;transition:opacity var(--d-light) var(--e-light)}
#offmsg.on{opacity:1}
#bootword,#offmsg,#toast,#hints{pointer-events:none}

/* HINTS / TOAST */
#hints{position:absolute;right:96px;top:994px;display:flex;gap:40px;font-size:20px;color:var(--text-2);transition:opacity var(--d-light) var(--e-light);z-index:22}
#hints div{display:flex;gap:8px;align-items:center}
.g{display:inline-flex;min-width:30px;height:30px;padding:0 6px;border:2px solid var(--text-2);border-radius:15px;align-items:center;justify-content:center;font-size:14px;font-weight:500;box-sizing:border-box;color:var(--text-2)}
#toast{position:absolute;left:96px;top:996px;font-size:20px;color:var(--warm);z-index:45;opacity:0;transform:translateY(8px);transition:opacity var(--d-enter) var(--e-light),transform var(--d-enter) var(--e-settle);max-width:1000px}
#toast.on{opacity:1;transform:none}
#pulse{position:absolute;left:0;bottom:0;width:1920px;height:2px;background:var(--light);opacity:0;z-index:46;pointer-events:none}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), line = $('#line');

/* ---------- Stage scaling ---------- */
let SCALE = 1;
function fit() {
  const vp = $('#viewport'), w = vp.clientWidth, h = vp.clientHeight;
  SCALE = Math.min(w / 1920, h / 1080);
  stage.style.transform = `translate(${(w - 1920 * SCALE) / 2}px, ${(h - 1080 * SCALE) / 2}px) scale(${SCALE})`;
}
new ResizeObserver(fit).observe($('#viewport'));
fit();

/* ---------- State ---------- */
const reduceOS = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = {
  screen: 'off', running: null, profile: 1, tech: false, sound: true, vol: 0.7,
  hc: false, rm: reduceOS, ts: 0, safe: 5, section: 0, filter: 0, from: 'home',
  prof: 'balanced', lkg: 'balanced', adv: false, advAck: false, idle: 2,
  caps: null, actual: null, safeMode: false, game: null, provisional: false, pending: null
};
/* Performance profiles: all values stay inside the range documented as stable on every BC-250 (≤ 2000 MHz at 1000 mV, ≤ 85 °C). */
const FACT = {
  silent: { n: 'SILENT', max: 1500, min: 1000, temp: 75, resp: 0, d: 'Mínimo ruido, temperatura y consumo. Multimedia, emulación y juegos ligeros.', fps: '30 o 40 FPS' },
  balanced: { n: 'BALANCED', max: 1850, min: 1000, temp: 85, resp: 1, d: 'El mejor equilibrio entre rendimiento, frametime, temperatura y ruido. Recomendado.', fps: '60 FPS' },
  performance: { n: 'PERFORMANCE', max: 2000, min: 1000, temp: 85, resp: 1, d: 'Máximo rendimiento dentro del rango estable de STONE MACHINE.', fps: 'Sin límite con VRR' }
};
const RESP = ['Suave', 'Normal', 'Rápida'];
const IDLE = ['Nunca', '15 min', '30 min', '60 min'];
const slots = [null, null, null];
const slotId = k => 'c' + (k + 1);
function profOf(id) {
  if (FACT[id]) return FACT[id];
  const k = +String(id).slice(1) - 1, sl = slots[k];
  return sl ? { n: 'CUSTOM 0' + (k + 1), ...sl } : FACT.balanced;
}
const usable = () => ['silent', 'balanced', 'performance', ...slots.map((sl, k) => sl && sl.state !== 'failed' ? slotId(k) : null).filter(Boolean)];
/* what is applied right now, as reported by stoned */
function effective() { return (S.running !== null && S.game && S.game.profile) || S.prof; }
/* Simulated readings for the prototype, shaped on documented BC-250 behaviour (governor throttles to respect the limit). */
function sim(id, load) {
  const p = typeof id === 'object' ? id : profOf(id), l = load === undefined ? 1 : load;
  const want = 56 + (p.max - 1500) * 0.042 * l + 6 * l;
  const temp = Math.min(p.temp - 1, want);
  const clk = want > p.temp - 1 ? Math.max(p.min, p.max - (want - temp) * 22) : p.max;
  return { clk: Math.round(clk / 10) * 10, temp: Math.round(temp), ppt: Math.round(60 + (clk - 1000) * 0.095 * l), gpu: Math.round(84 * l + Math.random() * 8), fps: clk >= 1800 ? 60 : clk >= 1600 ? 54 : 46 };
}
/* ---------- STONE PERFORMANCE API ----------
   The UI's only door to performance. Same methods, arguments, errors and returned state as
   stoned (D-Bus org.stonemachine.Performance1, see docs/STONED.md in the stone-os repo).
   In the prototype it talks to SimStoned, a simulation of stoned and of the GPU governor.
   In STONE OS only the transport changes: a bridge from STONE Home to D-Bus
   [PENDIENTE: depende de la tecnología final de STONE Home].
   The UI renders the state that comes back, never what it asked for. */
class PerfError extends Error { constructor(code, msg) { super(msg || code); this.code = code; } }
const ERR_TEXT = {
  Unsupported: 'Esta función no está disponible en esta consola',
  PermissionDenied: 'No se pudo cambiar el rendimiento: permiso denegado',
  InvalidValue: 'Valor no válido',
  HardwareError: 'El regulador de GPU devolvió un error. No se cambió nada',
  ServiceUnavailable: 'El servicio de rendimiento no responde. No se cambió nada',
  ThermalLimit: 'STONE MACHINE está muy caliente. Espera a que se enfríe para subir el rendimiento',
  ApplyFailed: 'El regulador no aplicó el cambio. STONE volvió a la configuración anterior',
  RollbackFailed: 'No se pudo restaurar la configuración. Reinicia: STONE arranca con valores de fábrica',
  SafeMode: 'Safe Mode: nada por encima de BALANCED',
  Busy: 'Hay una prueba de estabilidad en curso',
  NotValidated: 'Esta ranura falló. Pruébala de nuevo antes de usarla'
};
const REASON_TEXT = {
  thermal: 'la GPU superó el límite de temperatura', workload_failed: 'la carga de prueba se detuvo',
  gpu_errors: 'el sistema registró errores de GPU', clock_not_sustained: 'la GPU no sostuvo la frecuencia pedida',
  kernel_log_unavailable: 'no se pudo leer el registro del sistema', cancelled: 'se canceló', interrupted: 'se interrumpió'
};
const TEST_MS = { quick: 12000, standard: 20000 };   /* 5 and 30 min on STONE MACHINE */

const SimStoned = (() => {
  const INITIAL = { min: 1000, max: 1850, temp: 85, rec: 75 };   /* governor factory file */
  const ALLOWED = [1000, 2000];
  const gov = { ...INITIAL };
  const blank = () => ({ profile: 'balanced', lkg: 'balanced', slots: [null, null, null], per_game: {}, safe: false, safeReq: false, safeReason: null, fails: 0, last_failure: null, tests: [] });
  let st = blank(), flags = { clean: true }, game = null, run = null, pending = null, notice = null, home = false, fault = 'none';
  /* telemetry: nothing is read unless someone subscribed (stoned: telemetry.py) */
  const RATES = { performance_center: 1000, overlay: 500 };
  let sub = null, telTimer = 0;
  /* a session must last 10 min to validate a slot; x0.01 in the prototype (6 s) */
  const MIN_SESSION_MS = 6000;
  let session = null;
  /* thermal watch (stoned: thermal.py). Timings x0.1 in the prototype so it can be seen. */
  const TK = 0.1, TH = { warn: 85, reduce: 88, recover: 75, critical: 92, warnS: 30, reduceS: 30, recoverS: 60, fanMin: 70 };
  let th = { level: 'normal', reason: null, hot: null, vhot: null, cool: null, fanSeen: false, fanFailed: false, crit: false }, reduced = false, thNotice = null;
  const listeners = {};
  const emit = (ev, d) => (listeners[ev] || []).forEach(f => f(d));
  const fail = (code, msg) => { throw new PerfError(code, msg); };
  const slotIdx = id => /^c[1-3]$/.test(id) ? +id[1] - 1 : null;
  const isProfile = id => !!FACT[id] || (slotIdx(id) !== null && !!st.slots[slotIdx(id)]);
  const safeToApply = id => !!FACT[id] || (slotIdx(id) !== null && !!st.slots[slotIdx(id)] && st.slots[slotIdx(id)].state === 'validated');
  const values = id => { const p = FACT[id] || st.slots[slotIdx(id)]; return { max: p.max, min: p.min, temp: p.temp, resp: p.resp }; };
  const hasGov = () => fault !== 'nogov';
  const gpuTemp = () => fault === 'hot' ? 88 : fault === 'fanfail' ? 74 : 55;
  const caps = () => ({ board: true, driver: 'amdgpu', governor: hasGov(), advanced: hasGov(), gpu_range: ALLOWED,
    max_range: hasGov() ? [1500, 2000] : [], min_range: hasGov() ? [1000, 1500] : [], temp_range: [65, 85],
    stability_test: hasGov(), missing: hasGov() ? [] : ['regulador de GPU'], simulated: true });
  const actual = () => fault === 'unavailable' ? { error: 'ServiceUnavailable' } : !hasGov() ? { error: 'Unsupported' }
    : { min: gov.min, max: gov.max, temp: gov.temp, recovery: gov.rec };
  function apply(v) {           /* REQUEST -> EXECUTION -> VERIFY, rollback on mismatch */
    if (!hasGov()) fail('Unsupported');
    const before = { ...gov };
    if (fault !== 'ignore') { gov.min = v.min; gov.max = v.max; }
    gov.temp = v.temp; gov.rec = v.temp - 10;
    if (gov.min !== v.min || gov.max !== v.max) { Object.assign(gov, before); fail('ApplyFailed'); }
  }
  function canApply(v) {
    if (!hasGov()) fail('Unsupported');
    if (run) fail('Busy');
    if (st.safe && (v.max > FACT.balanced.max || v.temp > FACT.balanced.temp)) fail('SafeMode');
    if (reduced && v.max > FACT.silent.max) fail('ThermalLimit', 'reduced');
    if (v.max > gov.max && gpuTemp() >= 85) fail('ThermalLimit');
  }
  function validate(v) {        /* never trust the UI */
    const int = k => Number.isInteger(v[k]) ? v[k] : fail('InvalidValue', k);
    const r = { max: int('max'), min: int('min'), temp: int('temp'), resp: v.resp === undefined ? 1 : int('resp') };
    if (r.max < 1500 || r.max > 2000 || r.max % 50) fail('InvalidValue', 'max');
    if (r.min < 1000 || r.min > 1500 || r.min % 100 || r.min > r.max) fail('InvalidValue', 'min');
    if (r.temp < 65 || r.temp > 85 || r.temp % 5) fail('InvalidValue', 'temp');
    if (![0, 1, 2].includes(r.resp)) fail('InvalidValue', 'resp');
    return r;
  }
  const gate = write => new Promise(res => setTimeout(res, 60)).then(() => {
    if (fault === 'unavailable') fail('ServiceUnavailable');
    if (write && fault === 'denied') fail('PermissionDenied');
  });
  const applyProfile = id => { if (reduced && values(id).max > FACT.silent.max) return; apply(values(id)); };
  function sample() {
    const pid = (game && game.profile) || st.profile;
    const v = run ? run.values : reduced ? values('silent') : values(pid);
    const m = sim(v, run ? 1 : game ? .85 : .15), temp = fault === 'hot' ? 88 : fault === 'fanfail' ? 74 : m.temp;
    const out = { gpu_temp_c: temp, cpu_temp_c: 40 + Math.round(temp / 5), gpu_clock_mhz: m.clk, gpu_busy_pct: m.gpu, gpu_power_w: m.ppt,
      fan_rpm: fault === 'nofan' ? null : fault === 'fanfail' ? 0 : 1100 + Math.round((temp - 45) * 32),
      cpu_pct: Math.round((game ? 32 : 4) + Math.random() * 6), ram_used_mb: game ? 9800 : 3900, ram_total_mb: 15625,
      t: Date.now() / 1000, simulated: true };
    out.missing = Object.keys(out).filter(k => out[k] === null);
    return out;
  }
  const effId = () => (game && game.profile) || st.profile;
  function thermalReduce(reason) {
    if (run) { clearInterval(run.timer); run = null; endTrial(); emit('testFinished', { passed: false, reason: 'thermal', cancelled: true }); }
    const pid = effId(), k = slotIdx(pid);
    if (k !== null && st.slots[k]) {
      if (st.slots[k].state === 'validated') st.slots[k].state = 'tested';      /* it ran too hot */
      if (st.lkg === pid) st.lkg = 'balanced';
      if (st.profile === pid) st.profile = 'balanced';
      if (game && game.profile === pid) game.profile = st.profile;
      delete flags.provisional;
    }
    reduced = true; apply(values('silent'));
  }
  function thermalRecover() { reduced = false; try { applyProfile(effId()); } catch (e) { /* reported by actual */ } }
  function thermalNotify(ev) { thNotice = ev; emit('thermal', ev); emit('state', state()); }
  function thermalTick() {
    const now = performance.now() / 1000, m = sample(), t = m.gpu_temp_c, rpm = m.fan_rpm;
    th.hot = t >= TH.warn ? (th.hot ?? now) : null; th.vhot = t >= TH.reduce ? (th.vhot ?? now) : null; th.cool = t <= TH.recover ? (th.cool ?? now) : null;
    if (rpm !== null) { if (rpm > 0) { th.fanSeen = true; th.fanFailed = false; } else if (th.fanSeen && t >= TH.fanMin) th.fanFailed = true; }
    if (th.level === 'normal' && th.hot !== null && now - th.hot >= TH.warnS * TK) { th.level = 'warning'; th.reason = 'temperature'; thermalNotify({ level: 'warning', reason: 'temperature', gpu_temp_c: t }); }
    if (th.level !== 'reduced') {
      if (th.fanFailed || (th.vhot !== null && now - th.vhot >= TH.reduceS * TK)) {
        th.level = 'reduced'; th.reason = th.fanFailed ? 'fan' : 'temperature'; th.crit = false;
        thermalReduce(th.reason); thermalNotify({ level: 'reduced', reason: th.reason, gpu_temp_c: t });
      } else if (th.level === 'warning' && th.hot === null) { th.level = 'normal'; th.reason = null; thermalNotify({ level: 'normal', gpu_temp_c: t }); }
    } else {
      if (t >= TH.critical && !th.crit) { th.crit = true; thermalNotify({ level: 'critical', reason: th.reason, gpu_temp_c: t }); }
      if (th.cool !== null && now - th.cool >= TH.recoverS * TK && !th.fanFailed) {
        th.level = 'normal'; th.reason = null; thermalRecover(); thermalNotify({ level: 'normal', gpu_temp_c: t, back: effId() });
      }
    }
    /* one read every 5 s at rest (like stoned); a fast cadence only while something is hot */
    const alert = th.level !== 'normal' || th.hot !== null || th.vhot !== null || th.fanFailed || (rpm === 0 && th.fanSeen);
    thTimer = setTimeout(thermalTick, alert ? 100 : 5000);
  }
  let thTimer = setTimeout(thermalTick, 5000);
  function state() {
    return JSON.parse(JSON.stringify({
      profile: st.profile, provisional: !!flags.provisional, last_known_good: st.lkg, safe_mode: st.safe, safe_reason: st.safeReason,
      fail_count: st.fails, last_failure: st.last_failure, per_game: st.per_game, game,
      slots: st.slots.map((s, k) => s ? { ...s, id: 'c' + (k + 1) } : { id: 'c' + (k + 1), state: 'empty' }),
      testing: run && { slot: run.slot, level: run.level }, pending_result: pending, notice, actual: actual(), tests: st.tests.slice(-3),
      thermal: { level: th.level, reason: th.reason, reduced, last: thNotice }, telemetry: { rate_ms: sub ? RATES[sub] : 0 },
      games: { source: 'steam', running: session ? session.appid : null, seconds: session ? Math.round((performance.now() - session.t0) / 1000) : null }
    }));
  }
  function endTrial() { try { applyProfile(st.lkg); notice = null; } catch (e) { notice = e.code; } delete flags.trial; }
  /* BEFORE / AFTER (stoned: stability.compare). Sustained GPU clock, temperature, power and
     time throttled; not FPS, which only exist inside a game (MangoHud). */
  function compare(b, a) {
    if (!b || !b.median_clock_mhz || a.median_clock_mhz == null) return { verdict: 'insufficient' };
    const gain = Math.round(1000 * (a.median_clock_mhz - b.median_clock_mhz) / b.median_clock_mhz) / 10;
    const thr = (a.throttle_pct || 0) - (b.throttle_pct || 0);
    const verdict = thr >= 10 || gain < 0 ? 'worse' : gain < 2 ? 'no_gain' : 'better';
    return { verdict, clock_gain_pct: gain, temp_delta_c: a.max_temp_c - b.max_temp_c, power_delta_w: a.avg_power_w - b.avg_power_w,
      throttle_delta_pts: thr, baseline_profile: b.profile, level: a.level };
  }
  const result = (slot, level, v, t) => ({ slot, level, passed: true, reason: null, max_temp_c: t.temp, median_clock_mhz: t.clk,
    avg_power_w: t.ppt, throttle_pct: t.clk < .95 * v.max && t.temp >= v.temp - 1 ? 60 : 0, values: v });
  const baselineFor = level => [...st.tests].reverse().find(t => t.kind === 'baseline' && t.passed && t.level === level);
  function finish(result) {
    clearInterval(run.timer); const r = run; run = null;
    if (r.baseline) { result.kind = 'baseline'; result.profile = r.baseline; st.tests = [...st.tests, result].slice(-10); return emit('testFinished', result); }
    result.kind = 'slot';
    if (result.passed) result.comparison = compare(baselineFor(r.level), result);
    endTrial();
    pending = result.passed ? { slot: r.slot, values: r.values, level: r.level } : null;
    st.tests = [...st.tests, result].slice(-10);
    emit('testFinished', result);
  }
  const api = {
    on(ev, f) { (listeners[ev] = listeners[ev] || []).push(f); },
    async getCapabilities() { await gate(false); return caps(); },
    async getState() { await gate(false); return state(); },
    async getMetrics() { await gate(false); return sample(); },
    async subscribe(ctx) {
      await gate(false);
      if (!RATES[ctx]) fail('InvalidValue');
      if (sub !== ctx) { clearInterval(telTimer); sub = ctx; telTimer = setInterval(() => { if (fault !== 'unavailable') emit('metrics', sample()); }, RATES[ctx]); }
      emit('metrics', sample());
      return { rate_ms: RATES[ctx] };
    },
    async unsubscribe() { clearInterval(telTimer); telTimer = 0; sub = null; return { rate_ms: 0 }; },
    async homeReady() {
      await gate(true);
      if (!home) {
        home = true;
        if (!st.safe && safeToApply(st.profile) && st.profile !== 'balanced' && hasGov()) { try { applyProfile(st.profile); } catch (e) { /* stays at factory */ } }
        setTimeout(() => { delete flags.boot; }, 60000);
      }
      return state();
    },
    async setProfile(id) {
      await gate(true);
      if (run) fail('Busy');
      if (!isProfile(id)) fail('InvalidValue');
      const k = slotIdx(id);
      if (k !== null && st.slots[k].state === 'failed') fail('NotValidated');
      canApply(values(id));
      const prov = !safeToApply(id);
      if (prov) flags.provisional = { profile: id }; else delete flags.provisional;   /* flag before hardware */
      applyProfile(id);
      st.profile = id; if (!prov) st.lkg = id;
      return state();
    },
    async setSessionProfile(id) {
      await gate(true);
      if (!game) fail('InvalidValue', 'no game');
      if (!isProfile(id)) fail('InvalidValue');
      const k = slotIdx(id);
      if (k !== null && st.slots[k].state === 'failed') fail('NotValidated');
      canApply(values(id));
      if (!safeToApply(id)) flags.provisional = { profile: id, appid: game.appid };
      else if (flags.provisional && flags.provisional.appid === game.appid) delete flags.provisional;
      applyProfile(id); game.profile = id;
      return state();
    },
    async startTest(slot, v, level) {
      await gate(true);
      if (run) fail('Busy');
      if (!TEST_MS[level] || ![0, 1, 2].includes(slot)) fail('InvalidValue');
      if (!hasGov()) fail('Unsupported');
      const vals = validate(v);
      canApply(vals);
      if (st.safe) fail('Unsupported', 'safe mode');
      if (safeToApply(st.profile)) st.lkg = st.profile;          /* LAST KNOWN GOOD first */
      flags.trial = { profile: 'c' + (slot + 1), values: vals, level };   /* then the flag */
      apply(vals);                                                /* then the hardware */
      pending = null;
      const t0 = performance.now(), dur = TEST_MS[level] * (S.rm ? .5 : 1), target = sim({ n: 'draft', ...vals });
      run = { slot, values: vals, level, t0, timer: setInterval(() => {
        const p = Math.min(1, (performance.now() - t0) / dur);
        emit('testProgress', { p, target, values: vals });
        if (fault === 'gpuerr' && p > .6) return finish({ slot, level, passed: false, reason: 'gpu_errors', max_temp_c: target.temp, values: vals });
        if (p >= 1) finish(result(slot, level, vals, target));
      }, 120) };
      return state();
    },
    async measureBaseline(level) {
      await gate(true);
      if (run) fail('Busy');
      if (!TEST_MS[level]) fail('InvalidValue');
      if (!hasGov()) fail('Unsupported');
      if (reduced) fail('ThermalLimit');
      const pid = effId(), vals = values(pid), t0 = performance.now(), dur = TEST_MS[level] * (S.rm ? .5 : 1), target = sim(vals);

    if (st && st.tests) lastTests = st.tests;
    if (r.kind === 'baseline') return baselineDone(t.ri, r);
    r.passed ? testPassed(t.ri, r) : testFailed(t.ri, r);
  });
});
function testPassed(ri, r) {
  play('notify');
  openDlg(`<div class="res">SIN ERRORES EN LA PRUEBA</div><p>Prueba ${r.level === 'quick' ? 'rápida' : 'estándar'} sin errores de GPU. Temperatura máxima ${r.max_temp_c} °C, frecuencia sostenida ${r.median_clock_mhz} MHz (simulado). Una prueba superada reduce el riesgo, pero no garantiza estabilidad.</p>${r.comparison ? `<p class="cmp">${comparisonText(r.comparison)} Se compara la frecuencia sostenida, no los FPS.</p>` : ''}<p>Al terminar, STONE volvió a ${profOf(S.prof).n}. Si guardas, la ranura queda provisional y sin activarse; nunca se usa al encender hasta validarla${r.level === 'quick' ? ' con la prueba estándar y' : ' con'} una partida sin fallos.</p>
    <div class="btns"><span class="txt-f" data-f data-b="save">GUARDAR EN CUSTOM 0${r.slot + 1}</span><span class="txt-f" data-f data-b="no">DESCARTAR</span></div>`, {
    onA: el => {
      closeDlg();
      if (el.dataset.b === 'save') {
        play('select');
        return api('saveTestResult').then(st => { D = { slot: r.slot, ...baseOf(r.slot) }; if (st) toast(`CUSTOM 0${r.slot + 1} guardado (provisional). Sigue activo ${profOf(S.prof).n}`); enterTuning({ ri }); });
      }
      play('back'); api('discardTestResult').then(() => { D = { slot: r.slot, ...baseOf(r.slot) }; enterTuning({ ri }); });
    },
    onB: () => { closeDlg(); play('back'); api('discardTestResult').then(() => { D = { slot: r.slot, ...baseOf(r.slot) }; enterTuning({ ri }); }); }
  });
}
function testFailed(ri, r) {
  play('error');
  openDlg(`<h2>LA PRUEBA NO SE SUPERÓ</h2><p>Motivo: ${REASON_TEXT[r.reason] || r.reason}. No se guardó nada.</p><p>STONE volvió a la última configuración buena: ${profOf(S.prof).n}${S.actual && !S.actual.error ? ` (GPU hasta ${S.actual.max} MHz)` : ''}.</p>
    <div class="btns"><span class="txt-f" data-f data-b="ok">ENTENDIDO</span></div>`, {
    onA: () => { closeDlg(); play('back'); enterTuning({ ri }); }, onB: () => { closeDlg(); play('back'); enterTuning({ ri }); }
  });
}
/* Fail-safe demo: a GPU fault on the BC-250 takes the whole machine down, so recovery happens on the next boot. */
async function simulateCrash() {
  if (!testUI) return;
  testUI = null; $('#bCrash').disabled = true;
  PerfAPI.sim.crash();
  S.screen = 'transition'; play('error');
  $('#black').classList.add('fast', 'on'); line.classList.add('off');
  closeDlg(); chrome(false, false); $('#hints').classList.add('hide');
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); setBg('', 'none');
  S.running = null; setMetrics(false); D = null;
  await new Promise(r => setTimeout(r, 1800));
  boot();
}
/* After boot, Home tells stoned it is on screen; stoned answers with what it decided at boot. */
function bootNotices(st, rep) {
  if (st.safe_mode && st.safe_reason === 'failures') return safeModeDlg();
  if (st.safe_mode) return toast(`STONE arrancó en Safe Mode (${SAFE_REASON[st.safe_reason]}). Para salir: Ajustes → Rendimiento`, false);
  if (!rep || !rep.counted) return;
  const f = rep.failure || {};
  if (f.during === 'test') toast(`La prueba no terminó. STONE volvió a la última configuración buena: ${profOf(S.prof).n}.`);
  else if (f.during === 'provisional') toast(`${f.profile ? 'CUSTOM 0' + f.profile.slice(1) : 'La ranura'} falló y quedó desactivada. Activo: ${profOf(S.prof).n}.`);
  else toast(`STONE MACHINE no se apagó bien. Activo: ${profOf(S.prof).n}.`, false);
}
function safeModeDlg() {
  openDlg(`<div class="brand" style="font-size:40px">STONE</div><h2>SAFE MODE</h2><p>STONE MACHINE se detuvo dos veces seguidas. Arrancó con valores de fábrica, sin perfiles CUSTOM ni perfiles por juego.</p><p>Restaurar los ajustes de fábrica sale de Safe Mode. Tus ranuras CUSTOM se conservan.</p>
    <div class="btns"><span class="txt-f" data-f data-b="ok">RESTAURAR</span><span class="txt-f" data-f data-b="stay">SEGUIR EN SAFE MODE</span></div>`, {
    onA: el => {
      closeDlg();
      if (el.dataset.b === 'ok') { play('select'); return restoreDefaults(() => { if (NAV) NAV.id = ''; enterHome({ r: 0, c: 0 }); }); }
      play('back'); if (NAV) NAV.id = ''; enterHome({ r: 0, c: 0 });
    }
  }, false, true);
}
let DLG = null, dlgPrev = null;
function openDlg(html, handlers, noButtons, solid) {
  if (!DLG) dlgPrev = { screen: S.screen };
  DLG = handlers; S.screen = 'dlg';
  const d = $('#dlg'); d.classList.toggle('solid', !!solid); d.querySelector('.box').innerHTML = html; d.classList.add('on');
  const btns = [...d.querySelectorAll('.btns [data-f]')];
  NAV = mkNav(btns.length ? [btns] : [[d.querySelector('.box')]], { place: (el, b) => ({ x: b.x, y: b.y + b.h + 8, w: b.w }) });
  NAV.id = 'dlg';
  if (btns.length) requestAnimationFrame(() => { line.classList.remove('off'); applyFocus(); });
  if (btns.length) hints([['A', 'Elegir'], ...(handlers.onB ? [['B', 'Volver']] : [])]);
}
function closeDlg() { $('#dlg').classList.remove('on'); DLG = null; dlgPrev = null; }

/* ---------- POWER ---------- */
let powerFrom = 'home';
function openPower() {
  powerFrom = S.screen === 'game' ? 'game' : S.screen;
  S.screen = 'power';
  const box = $('#power .box');
  box.innerHTML = `<div class="h">ENERGÍA</div>
    <div class="main txt-f" data-f data-act="off">APAGAR</div>
    <div class="txt-f" style="font-size:26px" data-f data-act="reboot">Reiniciar</div>
    ${S.running !== null ? `<div class="warn">${G[S.running].n} se cerrará al apagar o reiniciar.</div>` : ''}`;
  $('#power').classList.add('on'); line.classList.remove('off');
  const items = [...box.querySelectorAll('[data-f]')];
  NAV = mkNav(items.map(e => [e]), { place: (el, b) => ({ x: b.x, y: b.y + b.h + 8, w: b.w }) });
  NAV.id = 'power';
  setTimeout(() => applyFocus(), S.rm ? 60 : 200);
  hints([['A', 'Elegir'], ['B', 'Cerrar']]);
}
function closePower() {
  play('back'); $('#power').classList.remove('on');
  if (powerFrom === 'game') { S.screen = 'game'; NAV = null; line.classList.add('off'); $('#hints').classList.add('hide'); return; }
  if (powerFrom === 'settings') return enterSettings();
  if (NAV) NAV.id = '';
  enterHome({ r: 1, c: 3 });
}
async function powerA(el) {
  const a = el.dataset.act; play('select');
  $('#power').classList.remove('on');
  if (a === 'sleep') return suspend();
  if (a === 'off') return shutdown(false);
  if (a === 'reboot') return shutdown(true);
}
async function suspend() {
  S.screen = 'transition'; $('#hints').classList.add('hide');
  $('#black').classList.remove('fast'); $('#black').classList.add('on'); line.classList.add('boot');
  setLine(720, 886, 480, { slow: true }); await wait(900);
  setLine(960, 886, 0, { slow: true }); await wait(1200);
  line.classList.add('off'); S.screen = 'asleep';
  $('#offmsg').textContent = 'Suspendida · Pulsa A o Enter para reanudar'; $('#offmsg').classList.add('on');
}
async function wake() {
  S.screen = 'transition'; $('#offmsg').classList.remove('on'); play('select');
  setLine(960, 886, 0); line.classList.remove('off'); await wait(60);
  setLine(720, 886, 480, { slow: true }); await wait(900);
  if (powerFrom === 'game' && S.running !== null) { setLine(960, 886, 0, { slow: true }); await wait(500); return showGame(G[S.running], true); }
  $('#black').classList.remove('on');
  if (powerFrom === 'settings') enterSettings(); else { if (NAV) NAV.id = ''; enterHome({ r: 1, c: 3, slow: true }); }
}
async function shutdown(reboot) {
  if (S.running !== null) PerfAPI.sim.steamExit(G[S.running].appid);
  PerfAPI.sim.powerOff();               /* orderly shutdown: stoned writes its clean marker */
  S.screen = 'transition'; $('#hints').classList.add('hide'); play('stop');
  chrome(false, false);
  $('#black').classList.remove('fast'); $('#black').classList.add('on');
  setLine(720, 886, 480, { slow: true }); await wait(1000);
  setLine(960, 886, 0, { slow: true }); await wait(1300);
  line.classList.add('off');
  S.running = null; setMetrics(false); NAV = null;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); setBg('', 'none');
  if (reboot) { await wait(900); return boot(); }
  S.screen = 'off'; await wait(1200);
  $('#offmsg').textContent = 'STONE MACHINE · Pulsa A o Enter para encender'; $('#offmsg').classList.add('on');
}

/* ---------- BOOT ---------- */
async function boot() {
  const rep = PerfAPI.sim.powerOn();    /* stoned --recover: decides, never applies */
  refreshCaps();
  S.screen = 'transition'; $('#offmsg').classList.remove('on');
  $('#black').classList.add('on'); line.classList.add('boot');
  await wait(500);
  setLine(957, 883, 6); line.classList.remove('off'); line.style.height = '6px'; line.style.borderRadius = '50%';
  await wait(500);
  line.style.height = ''; line.style.borderRadius = '';
  play('start');
  setLine(720, 886, 480, { slow: true });
  await wait(1100);
  $('#bootword').classList.add('on');
  await wait(1300);
  $('#bootword').classList.remove('on');
  await wait(400);
  $('#black').classList.remove('on');
  S.section = 0; if (NAV) NAV.id = ''; NAV = null;
  enterHome({ r: 0, c: 0, slow: true });
  setTimeout(() => line.classList.remove('boot'), 1300);
  /* Home is on screen: only now may stoned apply the saved profile (factory or validated) */
  api('homeReady').then(st => { if (st) setTimeout(() => bootNotices(st, rep), 1400); });
}

/* ---------- Input dispatch ---------- */
function act(a) {
  if (S.screen === 'transition') return;
  if (S.screen === 'off') { if (a === 'a') { audio(); boot(); } return; }
  if (S.screen === 'asleep') { if (a === 'a') wake(); return; }
  if (S.screen === 'game') { if (a === 'home' || a === 'menu') openQuick(); return; }
  showHints();
  const dirs = ['up', 'down', 'left', 'right'];
  if (S.screen === 'quick') {
    if (a === 'b' || a === 'home') return closeQuick();
    if (a === 'left' || a === 'right') return quickLR(a);
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return quickA(focusEl());
    return;
  }
  if (S.screen === 'power') {
    if (a === 'b') return closePower();
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return powerA(focusEl());
    return;
  }
  if (S.screen === 'dlg') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return DLG.onA(focusEl());
    if (a === 'b' && DLG.onB) return DLG.onB();
    return;
  }
  if (S.screen === 'perf') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return perfA(focusEl());
    if (a === 'b') { play('back'); cat = CATS.indexOf('Rendimiento'); return enterSettings({ pane: true, ri: 0 }); }
    if (a === 'home') { if (NAV) NAV.id = ''; return enterHome({ r: 0, c: 0 }); }
    return;
  }
  if (S.screen === 'tuning') {
    if (a === 'up' || a === 'down') return move(a);
    if (a === 'left' || a === 'right') return tuningLR(a === 'left' ? -1 : 1);
    if (a === 'a') return tuningA(focusEl());
    if (a === 'b') { play('back'); return enterPerf({ r: 0, c: 3 }); }
    return;
  }
  if (S.screen === 'settings') {
    if (dirs.includes(a)) return settingsMove(a);
    if (a === 'a') return settingsA(focusEl());
    if (a === 'b') { play('back'); $('#safe').classList.remove('on'); if (NAV.pane) return enterSettings(); if (NAV) NAV.id = ''; return enterHome({ r: 1, c: 2 }); }
    if (a === 'home') return enterHome({ r: 0, c: 0 });
    return;
  }
  if (S.screen === 'home') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return homeA(focusEl());
    if (a === 'lb' || a === 'rb') return section(a === 'lb' ? -1 : 1);
    if (a === 'y') return toast('Búsqueda: fuera de este prototipo', false);
    if (a === 'b') { if (S.section !== 0) { play('back'); S.section = 0; if (NAV) NAV.id = ''; return enterHome({ r: 0, c: 0 }); } return; }
    if (a === 'home') { if (NAV.r !== 0 || NAV.c !== 0) { play('nav'); NAV.r = 0; NAV.c = 0; applyFocus(); } return; }
    return;
  }
  if (S.screen === 'library') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return libraryA(focusEl());
    if (a === 'lb' || a === 'rb') return section(a === 'lb' ? -1 : 1);
    if (a === 'b' || a === 'home') { play('back'); S.section = 0; if (NAV) NAV.id = ''; return enterHome({ r: 0, c: 0 }); }
    if (a === 'lt' || a === 'rt') return letterJump(a === 'lt' ? -1 : 1);
    return;
  }
  if (S.screen === 'detail') {
    if (dirs.includes(a)) return move(a);
    if (a === 'a') return detailA(focusEl());
    if (a === 'b') { play('back'); clearInterval(installT); installT = 0; line.classList.remove('load'); return S.from === 'library' ? enterLibrary({ r: libRowOf(curG), c: libColOf(curG) }) : enterHome({ r: 0, c: Math.max(0, recent.indexOf(curG)) }); }
    if (a === 'home') { play('back'); S.section = 0; if (NAV) NAV.id = ''; return enterHome({ r: 0, c: 0 }); }
  }
}
function libRowOf(i) { const k = libList().findIndex(g => g.i === i); return k < 0 ? 1 : 1 + Math.floor(k / 6); }
function libColOf(i) { const k = libList().findIndex(g => g.i === i); return k < 0 ? 0 : k % 6; }
function letterJump(d) {
  if (NAV.r === 0) return;
  const list = libList(), k = (NAV.r - 1) * 6 + NAV.c, cur = list[k].n[0];
  let j = k; do { j += d; } while (j >= 0 && j < list.length && list[j].n[0] === cur);
  if (j < 0 || j >= list.length) return bump(d);
  NAV.r = 1 + Math.floor(j / 6); NAV.c = j % 6; play('nav'); applyFocus(); toast(list[j].n[0].toUpperCase(), false);
}

/* Directional hold: one step, 400 ms pause, then 8 steps/s, 16 steps/s after 2 s */
const hold = { dir: null, t0: 0, next: 0 };
function startHold(dir) { hold.dir = dir; hold.t0 = performance.now(); hold.next = hold.t0 + 400; act(dir); ensureLoop(); }
function stopHold(dir) { if (!dir || hold.dir === dir) hold.dir = null; }
function holdTick(now) {
  if (hold.dir && now >= hold.next) { act(hold.dir); hold.next = now + (now - hold.t0 > 2000 ? 62 : 125); }
}

const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'a', ' ': 'a', Escape: 'b', Backspace: 'b', q: 'lb', Q: 'lb', e: 'rb', E: 'rb', h: 'home', H: 'home', Home: 'home', y: 'y', Y: 'y', z: 'lt', Z: 'lt', x: 'rt', X: 'rt', Tab: 'menu' };
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('#bar')) return;
  const a = KEYS[e.key]; if (!a) return;
  e.preventDefault(); touched();
  if (e.repeat) return;
  if (['up', 'down', 'left', 'right'].includes(a)) startHold(a); else act(a);
});
window.addEventListener('keyup', e => { const a = KEYS[e.key]; if (a) stopHold(a); });
window.addEventListener('blur', () => stopHold());

/* Gamepad (standard mapping) */
const GP_BTN = { 0: 'a', 1: 'b', 3: 'y', 4: 'lb', 5: 'rb', 6: 'lt', 7: 'rt', 9: 'menu', 16: 'home', 8: 'home' };
let gpPrev = {}, gpDir = null, padOn = false;
function pollPads() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  const on = pads.length > 0;
  if (on !== padOn) { padOn = on; document.querySelector('#status .pad').classList.toggle('on', on); if (S.screen !== 'off') toast(on ? 'Mando conectado' : 'Mando desconectado', on); }
  const p = pads[0]; if (!p) return;
  for (const [i, a] of Object.entries(GP_BTN)) {
    const pr = p.buttons[i] && p.buttons[i].pressed;
    if (pr && !gpPrev[i]) { touched(); audio(); act(a); }
    gpPrev[i] = pr;
  }
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0, b = i => p.buttons[i] && p.buttons[i].pressed;
  let dir = null;
  if (b(12) || ay < -.6) dir = 'up'; else if (b(13) || ay > .6) dir = 'down'; else if (b(14) || ax < -.6) dir = 'left'; else if (b(15) || ax > .6) dir = 'right';
  if (dir !== gpDir) { if (dir) touched(); if (gpDir) stopHold(gpDir); if (dir) startHold(dir); gpDir = dir; }
}
/* The loop exists only while a gamepad is connected or a direction is held. Rate by state:
   menus every frame; game, off and transitions 20 Hz; deep idle (60 s without input) 15 Hz. */
let loopH = 0, idleT = 0;
function inputRate() {
  if (S.screen === 'quick' || S.screen === 'dlg') return 'raf';
  if (S.screen === 'game') return 16;   /* game: no rAF, but the Home button keeps frame-level latency */
  if (S.screen === 'off' || S.screen === 'transition') return 50;
  return S.deep ? 66 : 'raf';
}
function ensureLoop() {
  if (loopH) return;
  const r = inputRate();
  loopH = r === 'raf' ? requestAnimationFrame(tickInput) : setTimeout(tickInput, r);
}
function tickInput() { loopH = 0; pollPads(); holdTick(performance.now()); if (padOn || hold.dir) ensureLoop(); }
function touched() {
  if (S.deep) { S.deep = false; if (AC && AC.state !== 'running' && S.screen !== 'game') AC.resume(); }
  clearTimeout(idleT);
  idleT = setTimeout(() => { S.deep = true; if (S.screen !== 'game' && S.screen !== 'quick') audioSleep(); }, 60000);
}
window.addEventListener('gamepadconnected', () => { pollPads(); ensureLoop(); });
window.addEventListener('gamepaddisconnected', () => { pollPads(); });

/* Pointer: click focuses and activates, as the same focus model */
stage.addEventListener('click', e => {
  stage.focus({ preventScroll: true }); touched();
  if (S.screen === 'off' || S.screen === 'asleep') return act('a');
  const el = e.target.closest('[data-f]');
  if (!el || !NAV) return;
  if (S.screen === 'settings') {
    if (el.dataset.cat !== undefined) { cat = +el.dataset.cat; play('nav'); return enterSettings(); }
    if (el.classList.contains('srow')) { const ri = +el.dataset.row; if (!NAV.pane || NAV.c !== ri) { play('nav'); return enterSettings({ pane: true, ri }); } return settingsA(el); }
  }
  for (let r = 0; r < NAV.rows.length; r++) {
    const c = NAV.rows[r].indexOf(el);
    if (c >= 0) {
      if (NAV.r === r && NAV.c === c) return act('a');
      NAV.r = r; NAV.c = c; play('nav'); return applyFocus();
    }
  }
});

/* Bar buttons */
$('#bCrash').addEventListener('click', () => { simulateCrash(); });
/* Fault injection: what the UI shows when stoned or the governor misbehave */
$('#bFault').addEventListener('change', e => {
  PerfAPI.sim.setFault(e.target.value);
  refreshCaps().then(() => api('getState')).then(() => {
    if (S.screen === 'perf') enterPerf({ r: NAV.r, c: NAV.c, fresh: true });
    else if (S.screen === 'tuning') { D = null; enterTuning({ ri: NAV.r }); }
  });
});
$('#bSound').addEventListener('click', () => { S.sound = !S.sound; applyPrefs(); if (S.sound) { audio(); play('select'); } if (S.screen === 'settings') enterSettings({ pane: !!NAV.pane, ri: NAV.c }); });
$('#bReset').addEventListener('click', () => {
  S.running = null; S.tech = false; recent = [0, 1, 2, 3, 4, 5]; S.filter = 0; cat = 1;
  testUI = null; $('#bCrash').disabled = true; closeDlg(); PerfAPI.sim.wipe(); slots.fill(null); S.adv = false; S.advAck = false; D = null; G.forEach(g => { g.perf = null; });
  $('#quick').classList.remove('on'); $('#power').classList.remove('on'); setMetrics(false);
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); setBg('', 'none'); chrome(false, false);
  $('#hints').classList.add('hide'); line.classList.add('off', 'boot'); NAV = null;
  stage.focus({ preventScroll: true }); audio(); boot();
});

/* ---------- Start ---------- */
applyPrefs();
const ready = document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
ready.then(() => {
  /* only what the first Home needs is prepared, in idle time; the rest of the library stays COLD */
  want(G[recent[0]], 'hero', true); recent.forEach(i => want(G[i], 'cap')); recent.forEach(i => want(G[i], 'hero'));
  $('#offmsg').classList.add('on');
  stage.focus({ preventScroll: true });
  touched(); pollPads(); if (padOn) ensureLoop();
});
})();
</script>
