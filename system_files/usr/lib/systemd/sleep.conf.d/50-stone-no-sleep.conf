# La AMD BC-250 no tiene modo de reposo funcional: sólo apagado y reinicio.
# Se deshabilitan todas las formas de suspensión para que ningún componente
# (Steam, KDE, botón de encendido) deje la consola en un estado del que no vuelve.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
