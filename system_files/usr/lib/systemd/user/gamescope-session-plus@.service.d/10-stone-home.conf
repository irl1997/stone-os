# STONE OS: STONE Home rides along with the Game Mode session, whatever its variant
# (Bazzite starts gamescope-session-plus@ogui-steam.service; others @steam.service). A
# drop-in on the template applies to every instance. The ordering is declared here, from
# the session's side, because a unit cannot name "any instance" of a template.
[Unit]
Wants=stone-home-register.service stone-home-autostart.service
# Register while Steam is still closed (Steam rewrites shortcuts.vdf when it exits) ...
After=stone-home-register.service
# ... and start the launcher once the session is up (it waits for Steam's interface itself).
Before=stone-home-autostart.service
