<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the stoned user may own the name. -->
  <policy user="stoned">
    <allow own="org.stonemachine.Performance1"/>
  </policy>
  <!-- Anyone may call; write methods are authorized per call by polkit inside stoned. -->
  <policy context="default">
    <allow send_destination="org.stonemachine.Performance1" send_interface="org.stonemachine.Performance1"/>
    <allow send_destination="org.stonemachine.Performance1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.stonemachine.Performance1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
