name: Release

# Push a tag v<VERSION> (for example v0.1.0-rc1) to publish a release:
#   CI -> image (GHCR) -> installer ISO -> GitHub Release with notes, ISO parts and SHA256SUMS.
# A tag that does not match VERSION stops at the first step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag matches VERSION
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release facts
        id: info
        run: scripts/release-info.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" | tee -a "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: [check]
    uses: ./.github/workflows/ci.yml

  image:
    name: Image
    needs: [ci]
    uses: ./.github/workflows/build-image.yml
    with:
      skip_tests: true
    permissions:
      contents: read
      packages: write
    secrets: inherit

  installer:
    name: Installer
    needs: [check, image]
    uses: ./.github/workflows/build-installer.yml
    with:
      image_tag: ${{ needs.check.outputs.version }}
    permissions:
      contents: read
      packages: read

  publish:
    name: GitHub Release
    needs: [check, image, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer artifact is ~8 GB and is unzipped next to its download: without this
      # the runner's free disk is too tight (RC3 run: "Unable to download and extract artifact").
      - name: Maximize disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.installer.outputs.artifact }}
          path: dist

      - name: Download build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-metadata
          path: dist

      - name: Verify checksums before publishing
        working-directory: dist
        run: sha256sum -c SHA256SUMS --ignore-missing

      - name: Release notes
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.check.outputs.version }}
          ISO: ${{ needs.installer.outputs.iso_name }}
        run: |
          {
            cat RELEASE_NOTES.md
            echo
            echo "## Download and verify"
            echo
            echo "The ISO is split in parts because GitHub limits each release file to 2 GiB."
            echo
            echo '```'
            echo "cat ${ISO}.part-* > ${ISO}"
            echo "shasum -a 256 -c SHA256SUMS --ignore-missing     # macOS"
            echo "sha256sum -c SHA256SUMS --ignore-missing         # Linux"
            echo '```'
            echo
            echo "Image: \`${IMAGE}:${VERSION}\` (\`${IMAGE}@${DIGEST}\`)"
          } > dist/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISO: ${{ needs.installer.outputs.iso_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [[ "${PRERELEASE}" == "true" ]] && flags+=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --title "STONE OS ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md --verify-tag \
            dist/SHA256SUMS dist/build-metadata.json dist/"${ISO}".part-*
