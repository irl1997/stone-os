name: Build installer

# Builds the STONE OS installer ISO (Anaconda, bootc-image-builder) from an image already in
# GitHub Container Registry, and keeps it as a workflow artifact with its SHA-256.
# Run by hand (Actions -> Build installer -> Run workflow) or by release.yml for a version tag.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to install (empty = the version in VERSION)
        required: false
        type: string
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
    outputs:
      artifact:
        value: ${{ jobs.iso.outputs.artifact }}
      iso_name:
        value: ${{ jobs.iso.outputs.iso_name }}

permissions:
  contents: read

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    name: Installer ISO
    # Not ubuntu-26.04: on that runner osbuild's sandbox fails with
    # "mount: /run/osbuild/tree/dev: permission denied" (AppArmor, first RC1 run on GitHub).
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    outputs:
      artifact: ${{ steps.names.outputs.artifact }}
      iso_name: ${{ steps.names.outputs.iso }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Let osbuild's sandbox mount (AppArmor)
        run: |
          # Ubuntu's bwrap-userns-restrict profile blocks the mounts osbuild makes inside its
          # bubblewrap sandbox. Removed only on this throwaway runner, never in the image.
          if [ -e /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict || true
            echo "bwrap-userns-restrict unloaded"
          else
            echo "bwrap-userns-restrict not present"
          fi

      - name: What to install
        id: names
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          source config/build.env
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${INPUT_TAG:-${version}}"
          [[ "${tag}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad tag ${tag}"; exit 1; }
          eval "$(scripts/release-info.sh "v${version}" "${GITHUB_SHA}" --shell)"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          {
            echo "image_ref=${image}:${tag}"
            echo "update_ref=${image}:${channel}"
            echo "iso=stone-os-${tag}-x86_64.iso"
            echo "artifact=stone-os-${tag}-installer"
            echo "owner=$(id -u):$(id -g)"
          } >> "$GITHUB_OUTPUT"
          echo "Installs ${image}:${tag}; the console then follows ${image}:${channel}"

      - name: Installer configuration
        env:
          IMAGE_REF: ${{ steps.names.outputs.image_ref }}
          UPDATE_REF: ${{ steps.names.outputs.update_ref }}
        run: |
          sed -e "s|@UPDATE_REF@|${UPDATE_REF}|g" -e "s|@IMAGE_REF@|${IMAGE_REF}|g" disk_config/iso.toml > iso.rendered.toml
          cat iso.rendered.toml
          source config/build.env
          echo "Builder: ${BIB_IMAGE} @ $(skopeo inspect --format '{{.Digest}}' "docker://${BIB_IMAGE}")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Registry login (also works while the package is still private)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${REGISTRY_TOKEN}" | sudo podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build ISO (bootc-image-builder, anaconda-iso)
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main, as pinned by ublue-os/image-template
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./iso.rendered.toml
          image: ${{ steps.names.outputs.image_ref }}
          types: anaconda-iso
          rootfs: btrfs
          # The builder runs as root; hand the ISO to the runner user (as ublue-os/image-template).
          chown: ${{ steps.names.outputs.owner }}
          additional-args: --use-librepo=True

      - name: Name, checksum and split for GitHub Releases
        env:
          ISO_PATH: ${{ steps.build.outputs.anaconda-iso-output-path }}
          ISO: ${{ steps.names.outputs.iso }}
        run: |
          set -euo pipefail
          source config/build.env
          mkdir -p dist
          # Also if the builder left its output owned by root (first RC1 run: "Permission denied").
          out_dir="$(dirname "${ISO_PATH}")"
          sudo chown -R "$(id -u):$(id -g)" "${out_dir}"
          mv "${ISO_PATH}" "dist/${ISO}"
          cd dist
          # Each GitHub Release file must be under 2 GiB: the ISO is also published in parts.
          split -b "${ISO_PART_SIZE}" -d -a 2 "${ISO}" "${ISO}.part-"
          sha256sum "${ISO}" "${ISO}".part-* > SHA256SUMS
          cat SHA256SUMS
          # Only the parts travel on (artifact and release): the whole ISO would double the upload.
          # SHA256SUMS keeps the whole ISO's line, to check it after joining the parts.
          rm -f "${ISO}"
          ls -la
          { echo "### Installer"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
